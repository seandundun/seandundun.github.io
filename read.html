<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说阅读</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 阅读正文样式优化 */
        .novel-content p {
            margin-bottom: 1.2em;
            line-height: 1.9;
            text-indent: 2em;
        }
        .novel-content img {
            width: 100%;
            border-radius: 8px;
            margin: 1.5em 0;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">
    <!-- 顶部导航 -->
    <div class="sticky top-0 bg-stone-50/90 backdrop-blur border-b border-stone-200">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-stone-600 hover:text-stone-900">← 返回目录</a>
            <h2 id="chapterTitle" class="font-medium truncate mx-4"></h2>
            <span class="text-stone-400 text-sm" id="chapterNum"></span>
        </div>
    </div>

    <!-- 正文区域 -->
    <div class="max-w-2xl mx-auto px-4 py-8">
        <div id="novelContent" class="novel-content text-lg text-stone-700">
            加载中...
        </div>
    </div>

    <!-- 底部翻页 -->
    <div class="max-w-2xl mx-auto px-4 py-8 border-t border-stone-200">
        <div class="flex justify-between gap-4">
            <button id="prevBtn" class="flex-1 py-3 rounded border border-stone-300 hover:bg-stone-100 transition-colors">
                上一章
            </button>
            <button id="nextBtn" class="flex-1 py-3 rounded bg-stone-800 text-white hover:bg-stone-900 transition-colors">
                下一章
            </button>
        </div>
    </div>

    <script>
        // 获取URL里的章节ID
        const params = new URLSearchParams(window.location.search);
        let currentChapterId = parseInt(params.get('chapter')) || 1;
        let totalChapters = 0;

        // 加载章节列表（用于翻页）
        let chapterList = [];
        fetch('./data/book.json')
            .then(res => res.json())
            .then(book => {
                chapterList = book.chapters;
                totalChapters = book.chapters.length;
                loadChapter(currentChapterId);
            });

        // 加载单章内容
        function loadChapter(id) {
            currentChapterId = id;
            history.replaceState(null, '', `?chapter=${id}`);
            
            fetch(`./data/chapters/${id}.json`)
                .then(res => res.json())
                .then(chapter => {
                    // 标题
                    document.getElementById('chapterTitle').textContent = chapter.title;
                    document.getElementById('chapterNum').textContent = `第 ${id} 章 / 共 ${totalChapters} 章`;

                    // 渲染正文（图文混排）
                    const content = document.getElementById('novelContent');
                    content.innerHTML = '';
                    chapter.content.forEach(item => {
                        if (item.type === 'text') {
                            const p = document.createElement('p');
                            p.textContent = item.text;
                            content.appendChild(p);
                        } else if (item.type === 'image') {
                            const img = document.createElement('img');
                            img.src = item.src;
                            img.alt = item.alt || '';
                            content.appendChild(img);
                        }
                    });

                    // 翻页按钮状态
                    document.getElementById('prevBtn').disabled = id <= 1;
                    document.getElementById('nextBtn').disabled = id >= totalChapters;
                    
                    // 滚动到顶部
                    window.scrollTo(0, 0);
                });
        }

        // 翻页事件
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentChapterId > 1) loadChapter(currentChapterId - 1);
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentChapterId < totalChapters) loadChapter(currentChapterId + 1);
        });
    </script>
</body>
</html>
